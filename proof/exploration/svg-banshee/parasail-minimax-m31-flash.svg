<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <rect width="256" height="256" fill="#14101f"/>
  <defs>
    <radialGradient id="au" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#6ee7b7" stop-opacity=".38"/>
      <stop offset="1" stop-color="#6ee7b7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="mist" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#e8e4f0" stop-opacity=".22"/>
      <stop offset="1" stop-color="#e8e4f0" stop-opacity="0"/>
    </radialGradient>
    <path id="hairL" d="M96 66 C74 78 66 104 70 130 C74 156 66 176 60 196 C78 190 92 176 98 156 C102 142 100 120 98 100 Z"/>
    <path id="hairR" d="M160 66 C182 78 190 104 186 130 C182 156 190 176 196 196 C178 190 164 176 158 156 C154 142 156 120 158 100 Z"/>
  </defs>

  <!-- mist -->
  <ellipse cx="128" cy="150" rx="118" ry="86" fill="url(#mist)"/>
  <ellipse cx="128" cy="196" rx="96" ry="34" fill="url(#mist)" opacity=".7"/>
  <circle cx="128" cy="118" r="74" fill="url(#au)"/>

  <!-- wail marks -->
  <path d="M198 96 q12 -10 0 -20 q-10 -9 0 -18" fill="none" stroke="#6ee7b7" stroke-width="3" stroke-linecap="round" opacity=".55"/>
  <path d="M214 108 q9 -8 0 -16 q-8 -7 0 -14" fill="none" stroke="#6ee7b7" stroke-width="2.5" stroke-linecap="round" opacity=".35"/>
  <path d="M58 96 q-12 -10 0 -20 q10 -9 0 -18" fill="none" stroke="#6ee7b7" stroke-width="3" stroke-linecap="round" opacity=".45"/>
  <path d="M42 108 q-9 -8 0 -16 q8 -7 0 -14" fill="none" stroke="#6ee7b7" stroke-width="2.5" stroke-linecap="round" opacity=".3"/>

  <!-- hair behind -->
  <use href="#hairL" fill="#e8e4f0" opacity=".92"/>
  <use href="#hairR" fill="#e8e4f0" opacity=".92"/>

  <!-- shroud body -->
  <path d="M128 84 C96 84 78 106 74 138 C70 168 58 196 46 222 L210 222 C198 196 186 168 182 138 C178 106 160 84 128 84 Z" fill="#8f86a8"/>
  <!-- folds -->
  <path d="M104 118 C96 150 88 186 78 220 L96 220 C104 186 110 150 114 120 Z" fill="#6b6486" opacity=".85"/>
  <path d="M152 118 C160 150 168 186 178 220 L160 220 C152 186 146 150 142 120 Z" fill="#6b6486" opacity=".85"/>
  <path d="M128 140 C124 166 120 196 118 220 L138 220 C136 196 132 166 128 140 Z" fill="#a79ec0" opacity=".6"/>

  <!-- hood -->
  <path d="M128 26 C92 26 68 56 72 96 C74 118 84 130 96 136 C86 116 90 82 100 64 C108 50 118 44 128 44 C138 44 148 50 156 64 C166 82 170 116 160 136 C172 130 182 118 184 96 C188 56 164 26 128 26 Z" fill="#8f86a8"/>
  <path d="M128 44 C112 44 100 62 96 84 C92 104 94 124 100 136 C92 118 88 92 96 70 C102 52 114 44 128 44 Z" fill="#a79ec0" opacity=".55"/>

  <!-- face void -->
  <path d="M128 58 C110 58 100 72 100 92 C100 112 110 132 128 132 C146 132 156 112 156 92 C156 72 146 58 128 58 Z" fill="#1b1629"/>

  <!-- pale face -->
  <path d="M128 66 C114 66 106 78 106 94 C106 110 114 126 128 126 C142 126 150 110 150 94 C150 78 142 66 128 66 Z" fill="#e8e4f0" opacity=".92"/>

  <!-- red eyes -->
  <ellipse cx="118" cy="90" rx="5.5" ry="4" fill="#c0392b"/>
  <ellipse cx="139" cy="90" rx="5.5" ry="4" fill="#c0392b"/>
  <circle cx="118" cy="90" r="1.6" fill="#f0a898"/>
  <circle cx="139" cy="90" r="1.6" fill="#f0a898"/>
  <!-- tear streaks -->
  <path d="M118 95 C116 104 117 110 118 116" fill="none" stroke="#c0392b" stroke-width="2.4" stroke-linecap="round" opacity=".75"/>
  <path d="M139 95 C141 104 140 110 139 116" fill="none" stroke="#c0392b" stroke-width="2.4" stroke-linecap="round" opacity=".75"/>

  <!-- open wailing mouth -->
  <path d="M128 100 C120 100 116 108 118 118 C120 128 126 132 128 132 C130 132 136 128 138 118 C140 108 136 100 128 100 Z" fill="#2a1220"/>
  <path d="M121 104 C124 102 132 102 135 104 C133 100 123 100 121 104 Z" fill="#e8e4f0" opacity=".9"/>

  <!-- spectral glow at base -->
  <ellipse cx="128" cy="218" rx="74" ry="16" fill="url(#au)" opacity=".8"/>
  <path d="M104 226 C112 220 122 218 128 220 C134 218 144 220 152 226 C142 230 114 230 104 226 Z" fill="#6ee7b7" opacity=".25"/>
</svg>